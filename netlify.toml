# Netlify: web tĩnh, không cần build
[build]
  publish = "."
  # Sinh js/secrets.js từ biến môi trường GEMINI_API_KEY (Site settings → Environment variables)
  command = "printf \"window.VF_SECRETS = { GEMINI_API_KEY: '%s' };\" \"$GEMINI_API_KEY\" > js/secrets.js"

# Cache lâu cho CSS/JS (đổi ?v= trong index.html khi cập nhật), không cache trang chính
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
# Service worker & manifest luôn lấy bản mới
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
